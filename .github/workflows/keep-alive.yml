name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *' # tous les jours à 8h UTC
  workflow_dispatch: # permet de lancer manuellement

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (vraie requête DB)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/job_applications?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase a répondu avec le code HTTP: $HTTP_CODE"
          # 200 (données) ou 401/403 (bloqué par RLS) => la requête a atteint Postgres = OK
          if [ "$HTTP_CODE" -ge 500 ] || [ "$HTTP_CODE" -eq 000 ]; then
            echo "::error::Supabase injoignable (code $HTTP_CODE)"
            exit 1
          fi
